spring:
  application:
    name: lol-data-hub
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/lol_data_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:loldatahub}
    password: ${MYSQL_PASSWORD:loldatahub}
    hikari:
      connection-init-sql: SET SESSION group_concat_max_len = 65535
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

lol-datahub:
  catalog:
    # 只控制公共查询目录，不删除数据库中已经同步的其他赛事。
    # 顺序即前端下拉列表顺序；赛段范围与官网大数据页面保持一致。
    stage-name-overrides:
      237-114: 第三赛段淘汰赛
    visible-events:
      - season-id: 237
        stage-ids: [112, 113, 100, 102, 103, 104, 106, 114]
      - season-id: 238
        stage-ids: [19, 18]
      - season-id: 239
        stage-ids: [28, 18]
      - season-id: 218
        stage-ids: [97, 100, 98, 105, 102, 103, 104, 106, 107, 108]
      - season-id: 221
        stage-ids: [101, 18]
      - season-id: 226
        stage-ids: [28, 18]
      - season-id: 229
        stage-ids: [28, 77, 18]
      - season-id: 206
        stage-ids: [1, 5, 90, 91, 92, 8]
      - season-id: 208
        stage-ids: [28, 89]
      - season-id: 212
        stage-ids: [28, 77, 18]
      - season-id: 190
        stage-ids: [1, 5, 7, 8]
      - season-id: 194
        stage-ids: [28, 85]
      - season-id: 201
        stage-ids: [28, 77, 18]
  source:
    tjstats:
      base-url: ${TJSTATS_BASE_URL:https://open.tjstats.com/match-auth-app/open/v1}
      authorization: ${TJSTATS_AUTHORIZATION:}
      connect-timeout: 5s
      read-timeout: 20s
  collector:
    scheduling:
      enabled: false
  cache:
    statistics-ttl: 12h
  security:
    internal-api-token: ${INTERNAL_API_TOKEN:}
