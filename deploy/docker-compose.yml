services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: lol-datahub-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.4
    container_name: lol-datahub-mysql
    environment:
      MYSQL_DATABASE: lol_data_hub
      MYSQL_USER: loldatahub
      MYSQL_PASSWORD: loldatahub
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - lol-datahub-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: lol-datahub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - lol-datahub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lol-datahub-mysql:
  lol-datahub-redis:
