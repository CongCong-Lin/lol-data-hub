name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -q test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  compose:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      MYSQL_PASSWORD: ci-app-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      REDIS_PASSWORD: ci-redis-password
      INTERNAL_API_TOKEN: ci-internal-token-ci-internal-token
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build

      - name: Start stack and wait for health checks
        run: docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 240

      - name: Smoke public endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8080/actuator/health
          curl --fail --silent --show-error http://localhost:8081/
          curl --fail --silent --show-error http://localhost:8081/api/v1/catalog/seasons

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
